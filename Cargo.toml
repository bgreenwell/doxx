[package]
name = "doxx"
version = "0.1.4"
edition = "2021"
rust-version = "1.88"
description = "Terminal document viewer for .docx files"
license = "MIT"
repository = "https://github.com/bgreenwell/doxx"
homepage = "https://github.com/bgreenwell/doxx"
documentation = "https://github.com/bgreenwell/doxx#readme"
readme = "README.md"
authors = ["Brandon Greenwell <greenwell.brandon@gmail.com>"]
keywords = ["docx", "terminal", "document", "viewer", "tui"]
categories = ["command-line-utilities", "text-processing"]
default-run = "doxx"
exclude = [
    "CLAUDE.md",
    "assets/",
    "src/bin/generate_test_docs.rs",
    "tests/fixtures/README.md",
    ".DS_Store",
    "*.tmp",
    "*.log",
    "*.bak",
    "*~"
]

[lib]
name = "doxx"
crate-type = ["rlib"]

[dependencies]
# Document parsing
docx-rs = "0.4"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"
arboard = "3.3"

# Image support
viuer = "0.11"
image = "0.25"
zip = "2.0"
ratatui-image = { version = "9.0", default-features = false, features = ["image-defaults", "crossterm"] }

tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs"] }

# Text processing
unicode-segmentation = "1.10"
regex = "1.10"
once_cell = "1.19"
quick-xml = "0.36"

# CLI and utilities
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Configuration
dirs = "5.0"
toml = "0.8"
unicode-width = "0.2.0"

# Release optimizations
[profile.release]
codegen-units = 1
lto = true

[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.release]
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
pre-release-commit-message = "chore: release {{version}}"
tag-message = "Release {{version}}"

[package.metadata.aur]
depends = []
makedepends = ["cargo"]

[package.metadata.wix]
upgrade-guid = "9d14176b-1499-42ef-bc1a-c6570e19717a"
path-guid = "12997dda-1476-4350-adba-af75a7270d8e"
license = false
eula = false
